name: Build and Deploy 

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Dependency
        run: |
          sudo apt update
          sudo apt install guile-3.0 guile-3.0-dev

      - name: Checkout
        uses: actions/checkout@master
        with:
          persist-credentials: false

      - name: Install Guile Commonmark and Haunt
        run: |
          sudo apt install ./dependency/guile-commonmark_0.1.2+20240812-3_amd64.deb
          tar -xf ./dependency/haunt-0.3.0.tar.gz
          cd haunt-0.3.0
          ./configure
          make
          sudo make install
          cd ../
          rm -rf haunt-0.3.0/

      - name: Build
        run: |
          haunt build

      - name: Deploy to GH Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
